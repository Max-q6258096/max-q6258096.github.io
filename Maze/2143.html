<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE RED PATH PUZZLE</title>
    <style>
        /* General Styles */
        body { 
            background: #1a1a1a; 
            color: #ddd; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: #222; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* The Image Gallery */
        .image-gallery {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 20px;              
            margin: 20px 0;
        }

        .puzzle-image {
            width: 100%;       
            max-width: 500px;  
            height: auto;      
            border: 4px solid #333;
            border-radius: 4px;
            cursor: zoom-in;
            transition: transform 0.3s ease, border-color 0.3s ease;
            z-index: 1;
        }

        .puzzle-image:hover {
            border-color: #ff3333; /* Red hover for the red path */
        }

        .enlarged {
            transform: scale(2.0);
            z-index: 10;
            cursor: zoom-out;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Input & Button Styles */
        input[type="text"] {
            background: #111;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 12px;
            font-size: 1.1rem;
            outline: none;
            width: 60%;
            margin-bottom: 10px;
        }
        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        button:hover { background: #cc0000; }

        #hint-text {
            display: none;
            color: #ffae00;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>THE RED DOOR</h1>
        <p>The red ink on the paper seems fresh. Solve the cypher to proceed.</p>
        
        <div class="image-gallery">
            <img src="Cypher3.jpg" alt="Puzzle Clue 1" class="puzzle-image" onclick="toggleSize(this)">
            <img src="Red3.png" alt="Puzzle Clue 2" class="puzzle-image" onclick="toggleSize(this)">
        </div>

        <div class="code-box">
            <form id="puzzleForm" onsubmit="processEntry(event)">
                <input type="text" id="userInput" placeholder="Enter secret phrase..." required autocomplete="off">
                <br>
                <button type="submit">Unlock Door</button>
            </form>

            <div id="hint-container">
                <button type="button" onclick="revealHint()" style="background:#ffae00; color: black; font-size: 0.8rem; border:none; padding: 5px 10px; cursor: pointer;">Need a Hint?</button>
                <p id="hint-text">The code is 12 letters long. It's made of 2 words. Try looking up to down instead of left to right.</p>
            </div>
        </div>
    </div>

    <script>
        function toggleSize(image) {
            image.classList.toggle('enlarged');
        }

        function revealHint() {
            document.getElementById('hint-text').style.display = 'block';
        }

        function processEntry(event) {
            event.preventDefault(); 
            
            const typedValue = document.getElementById('userInput').value.toLowerCase().trim();
            const correctCode = "spysuspected"; 

            if (typedValue === correctCode) {
                // 1. Mark RED as completed
                localStorage.setItem('redPathComplete', 'true');

                // 2. Check if other paths are already done
                const isBlueDone = localStorage.getItem('bluePathComplete') === 'true';
                const isGreenDone = localStorage.getItem('greenPathComplete') === 'true';

                // 3. Redirection Logic
                if (isBlueDone && isGreenDone) {
                    // All three paths finished!
                    window.location.href = "Final1.html";
                } 
                else if (isBlueDone) {
                    // Red is done AND Blue is done, lead to Blue+Red special transition
                    window.location.href = "GreenFinal.html";
                } 
                else if (isGreenDone) {
                    // Red is done AND Green is done, lead to Green+Red special transition
                    window.location.href = "BlueFinal.html";
                } 
                else {
                    // This is only the first path completed
                    window.location.href = "BGDoor.html";
                }
            } else {
                alert("The lock doesn't budge. '" + typedValue + "' is not the answer.");
            }
        }
    </script>
</body>
</html>
