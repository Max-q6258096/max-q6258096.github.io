<script>
        // NEW: Function to toggle the "enlarged" class
        function toggleSize(image) {
            image.classList.toggle('enlarged');
        }

        function processEntry(event) {
            event.preventDefault(); 
            
            const typedValue = document.getElementById('userInput').value.toLowerCase().trim();

            // Combined the singular and plural check correctly here
            if (typedValue === "stories" || typedValue === "story") {
                // Mark Green Path as complete if this is the end of the path
                localStorage.setItem('greenPathComplete', 'true');

                // Check other paths for the redirection logic
                const isRedDone = localStorage.getItem('redPathComplete') === 'true';
                const isBlueDone = localStorage.getItem('bluePathComplete') === 'true';

                if (isRedDone && isBlueDone) {
                    window.location.href = "MasterVictory.html";
                } else if (isRedDone) {
                    window.location.href = "GreenRedTransition.html";
                } else if (isBlueDone) {
                    window.location.href = "GreenBlueTransition.html";
                } else {
                    window.location.href = "Green2.html";
                }
            } else {
                alert("The lock doesn't budge. '" + typedValue + "' is not the answer.");
            }
        } // This closing bracket was missing!

        function revealHint() {
            document.getElementById('hint-text').style.display = 'block';
        }
    </script>
