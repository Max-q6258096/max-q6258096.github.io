<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The White Door</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #ddd; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 50px 20px;
            margin: 0;
        }
          .container { 
            /* Increased width to allow the image to grow */
            max-width: 90vw; 
            width: 100%;
            margin: auto; 
            background: #222; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);

        .victory-image {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 30px;
        }

        h1 { 
            color: #d4af37; 
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 20px 0;
            color: #bbb;
        }

        .btn-restart {
            background: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 15px 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-restart:hover {
            background: #d4af37;
            color: black;
        }
    </style>
</head>
<body>

    <div class="victory-container">
        <img src="WhiteEnd.png" alt="The Maze Exit" class="victory-image">

        <h1> Truth </h1>
        
        <div class="message">
            <p>You enter the room and, besides a beautiful statue, the room is empty. You look outside the window and stare at the beautiful sky. </p>
            <p>You leave the maze soon after. You gave up a life of fame or fortune, but you realize that that isn't what would bring you happiness in life.</p>
        </div>

        <button class="btn-restart" onclick="restartGame()">Begin the Maze Again</button>
    </div>

    <script>
        function restartGame() {
            // This clears all the progress stamps we saved
            localStorage.clear();
            // Redirects back to the very first page of your game
            window.location.href = "Start.html"; 
        }
    </script>
