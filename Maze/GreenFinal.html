<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Which door will you take next? </title>
    <style>
        body { background: #1a1a1a; color: #ddd; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { max-width: 600px; margin: auto; background: #333; padding: 20px; border-radius: 8px; }
        
        /* New styling for your room image */
        .room-image {
            width: 100%;       /* Fills the width of the container */
            max-width: 400px;  /* Keeps it from becoming too large */
            height: auto;      /* Maintains aspect ratio */
            border-radius: 4px;
            margin-bottom: 20px; /* Space between image and text */
            border: 2px solid #444;
        }

        .choice { 
            display: block; 
            background: #4a90e2; 
            color: white; 
            text-decoration: none; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
        }
        .choice:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="container">
        <img src="Greendoor.jpg" alt="Which path will you take next?" class="room-image">

        <h1> The Maze Continues </h1>
        <p> You see A masked figure standing infront of a green door. "You've done well, only one path remains..." </p>
        
        <a class="choice" href="Path3.html">Go through the Green Door</a>

    </div>

</html>
