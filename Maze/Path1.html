<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE PICTURE PUZZLE</title>
    <style>
        /* General Styles */
        body { 
            background: #1a1a1a; 
            color: #ddd; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        .container { 
            max-width: 1000px; /* Widened to fit two images */
            margin: auto; 
            background: #222; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* The Image Gallery (Side-by-Side Layout) */
        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 20px; /* Space between the images */
            margin: 20px 0;
            flex-wrap: wrap; /* Allows stacking on small screens */
        }

        .puzzle-image {
            flex: 1; /* Makes images grow to fill space */
            min-width: 300px; /* Prevents them from getting too tiny */
            max-width: 450px; 
            height: auto;      
            border: 4px solid #333;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .puzzle-image:hover {
            transform: scale(1.02); /* Slight zoom when hovering */
            border-color: #00FF00;
        }

        /* Input & Button Styles */
        input[type="text"] {
            background: #111;
            border: 1px solid #00FF00;
            color: #00FF00;
            padding: 12px;
            font-size: 1.1rem;
            outline: none;
            width: 60%;
            margin-bottom: 10px;
        }
        button {
            background: #00FF00;
            color: black;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        button:hover { background: #00cc00; }

        #hint-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #555;
            display: block; /* Visible immediately */
        }

        #hint-text {
            display: none;
            color: #ffae00;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>THE LOCKED DOOR</h1>
        <p>You find two mysterious frames. The password is hidden between the details of both.</p>
        
        <div class="image-gallery">
            <img src="Cypher1.jpg" alt="Puzzle Clue 1" class="puzzle-image">
            <img src="Red1Room.jpg" alt="Puzzle Clue 2" class="puzzle-image">
        </div>

        <div class="code-box">
            <form id="puzzleForm" onsubmit="processEntry(event)">
                <input type="text" id="userInput" placeholder="Enter secret phrase..." required autocomplete="off">
                <br>
                <button type="submit">Unlock Door</button>
            </form>

            <div id="hint-container">
                <button type="button" onclick="revealHint()" style="background:#ffae00; font-size: 0.8rem;">Need a Hint?</button>
                <p id="hint-text">Compare the two images. Look closely at the spelling, check for typos that may form a word...</p>
            </div>
        </div>
    </div>

    <script>
        function processEntry(event) {
            event.preventDefault(); 
            
            const typedValue = document.getElementById('userInput').value.toLowerCase().trim();
            const correctCode = "elenor"; 

            if (typedValue === correctCode) {
                window.location.href = "elenor.html";
            } else {
                alert("The lock doesn't budge. '" + typedValue + "' is not the answer.");
            }
        }

        function revealHint() {
            document.getElementById('hint-text').style.display = 'block';
        }
    </script>
</body>
</html>
